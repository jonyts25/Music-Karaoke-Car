<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>JS smoke (sin React)</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        gap: 1rem;
      }
      button {
        min-height: 3rem;
        min-width: 8rem;
        font-size: 1.25rem;
      }
    </style>
  </head>
  <body>
    <p id="status">JS smoke (sin React)</p>
    <button id="btn" type="button">0</button>
    <script>
      var n = 0;
      var btn = document.getElementById("btn");
      var status = document.getElementById("status");
      status.textContent = "JS activo";
      btn.addEventListener("click", function () {
        n += 1;
        btn.textContent = String(n);
      });
    </script>
  </body>
</html>
